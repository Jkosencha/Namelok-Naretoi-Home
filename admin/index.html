<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Private staff area: keep it out of search engines -->
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/png" href="../images/logo.png" />
    <meta name="theme-color" content="#f3ede3" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Kaushan+Script&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      // Apply the saved light/dark choice before the page paints
      try {
        var t = localStorage.getItem("namelok-theme");
        document.documentElement.dataset.theme = t || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="admin.css?v=12" />
    <title>Namelok Dashboard</title>
  </head>
  <body>
    <div id="app"><p class="loading">Loading…</p></div>
    <noscript>The dashboard needs JavaScript turned on.</noscript>
    <script src="../js/supabase-config.js?v=1"></script>
    <script type="module" src="app.js?v=12"></script>
  </body>
</html>
