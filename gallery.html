<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--bootstrap links-->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <!--css links-->
    <link rel="stylesheet" href="css/index.css" />

    <title>Our Gallery – Namelok Naretoi Home</title>
  </head>
  <body>
    <!--Logo and navigation bar-->
    <div id="navbar"></div>
<script src="components/navbar.js"></script>

    <div class="hero-section hero-gallery">
      <div class="hero-text">
        <h1>Our Gallery</h1>
        <p>Glimpses of life and work at Namelok Naretoi Home.</p>
      </div>
    </div>

    <section class="masonry-gallery">
      <div class="gallery-container">
        <img src="images/child1.jpg" alt="" />
        <img src="images/child2.jpg" alt="" />
        <img src="images/child4.jpg" alt="" />
        <img src="images/child5.jpg" alt="" />
        <img src="images/child8.jpg" alt="" />
      </div>
    </section>

    <div id="contact-section"></div>
<script src="components/contact-section.js"></script>

    <!-- Footer -->
    <div id="footer"></div>
<script src="components/footer.js"></script>

    <!-- Back to top -->
    <div class="upArrowCont" id="upArrow">
      <img src="images/upArrow.svg" alt="Back to top" class="upArrow" />
    </div>

    <script src="js/index.js"></script>
  </body>
</html>
